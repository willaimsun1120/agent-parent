server:
  port: 8080

spring:
  application:
    name: order-cs-example
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:order_agent_demo}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123456}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

agent:
  vector-store:
    type: ${VECTOR_STORE_TYPE:qdrant}  # qdrant | milvus
  platform:
    biz-domain: order
    biz-module: cs
    conversation:
      max-history-turns: 6
    clarification:
      enabled: true
      biz-key:
        enabled: true
        pattern: "ORD-\\d+"
        trigger-keywords: [订单, 退款, 支付, 权益, 会员]
        missing-key-prompt: |
          我还没有识别到订单号。请先补充类似 ORD-1001 的订单号，我才能查询订单、支付、退款或权益状态。
          如果你是在追问上一轮提到的订单，也可以直接说「订单号是 ORD-xxxx」。
        max-ask-times: 2
    modes:
      default-mode: manual
    rag-category:
      enabled: true
      strategy: ${RAG_CATEGORY_STRATEGY:llm}
      default-category: general
      categories:
        refund:
          keywords: [退款, refund, 退钱, 退费, 退回]
          regex: "退[款费钱]|refund"
          description: "用户咨询退款、退钱、退费相关问题"
        payment:
          keywords: [支付, payment, 回调, 付款, 扣款]
          regex: "支付|付款|回调|扣款|payment"
          description: "用户咨询支付、付款、回调相关问题"
        benefit:
          keywords: [权益, 会员, benefit, VIP, 特权]
          regex: "权益|会员|特权|benefit|VIP"
          description: "用户咨询权益、会员、特权相关问题"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

dashscope:
  api-key: ${DASHSCOPE_API_KEY:sk-498e7aea877141fdb7e5c4445d7c12c3}
  chat-model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
  embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}

qdrant:
  host: ${QDRANT_HOST:127.0.0.1}
  port: ${QDRANT_PORT:6333}
  collection: ${QDRANT_COLLECTION:order_support_knowledge}
  vector-size: ${QDRANT_VECTOR_SIZE:1024}

milvus:
  host: ${MILVUS_HOST:127.0.0.1}
  port: ${MILVUS_PORT:19530}
  collection: ${MILVUS_COLLECTION:order_support_knowledge}
  vector-size: ${MILVUS_VECTOR_SIZE:1024}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  security:
    enabled: ${APP_API_KEY_ENABLED:false}
    api-key: ${APP_API_KEY:}

jetcache:
  statIntervalMinutes: 15
  areaInCacheName: false
  local:
    default:
      type: caffeine
      keyConvertor: fastjson2
      limit: 20000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} traceId:%X{traceId:-} - %msg%n"
